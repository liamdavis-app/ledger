function frequencyHeatmap(){
  var today=new Date(todayStr());var sessionDates={};
  db.sessions.forEach(function(s){sessionDates[s.date]=s.name;});
  var dow=today.getDay()||7;
  var startDate=new Date(today);startDate.setDate(startDate.getDate()-(dow-1)-(7*7));
  var days=['M','T','W','T','F','S','S'];
  var r='<div class="card"><div style="display:grid;grid-template-columns:20px repeat(8,1fr);gap:4px;align-items:center">';
  r+='<div></div>';
  for(var w=0;w<8;w++){var wd=new Date(startDate);wd.setDate(wd.getDate()+w*7);r+='<div style="font-size:9px;color:var(--faint);font-weight:600;text-align:center">'+fmtShort(wd.toISOString().slice(0,10)).replace(/\s*\d{4}/,'')+'</div>';}
  for(var d=0;d<7;d++){
    r+='<div style="font-size:9px;color:var(--faint);font-weight:700">'+days[d]+'</div>';
    for(var wk=0;wk<8;wk++){
      var cellDate=new Date(startDate);cellDate.setDate(cellDate.getDate()+wk*7+d);
      var ds=cellDate.toISOString().slice(0,10);
      var future=cellDate>today;var split=sessionDates[ds];
      var col=split?SPLIT_COLOURS[split]||'#C7C7CC':'var(--hair2)';
      r+='<div style="aspect-ratio:1;border-radius:3px;background:'+col+';opacity:'+(future?'0.25':'1')+'" title="'+(split?esc(split):'')+'"></div>';
    }
  }
  r+='</div>';
  r+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair2)">';
  Object.keys(SPLIT_COLOURS).forEach(function(k){r+='<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:'+SPLIT_COLOURS[k]+'"></div><span style="font-size:11px;color:var(--ink2);font-weight:600">'+esc(k)+'</span></div>';});
  r+='</div></div>';
  return r;
}

function muscleBalance(sessionsArg){
  var recent=sessionsArg||db.sessions;
  if(!recent.length)return '<div class="card"><p class="muted tiny">No session data in this timeframe.</p></div>';
  var groupSets={};GROUPS.forEach(function(g){groupSets[g]=0;});
  recent.forEach(function(s){s.exercises.forEach(function(e){var g=groupOf(e.name);groupSets[g]=(groupSets[g]||0)+e.sets.length;});});
  var total=Object.keys(groupSets).reduce(function(a,g){return a+groupSets[g];},0);
  if(!total)return '<div class="card"><p class="muted tiny">No session data in this timeframe.</p></div>';
  var order=GROUPS.slice().sort(function(a,b){return groupSets[b]-groupSets[a];});
  var maxS=groupSets[order[0]]||1;
  var groupColours={Chest:'#1D1D1F',Back:'#3A3A3D',Shoulders:'#57575B',Biceps:'#737378',Triceps:'#8F8F94',Legs:'#ABABAF',Core:'#C7C7CB',Other:'#E0E0E3'};
  var r='<div class="card">';
  order.forEach(function(g){
    if(!groupSets[g])return;
    var pct=Math.round(groupSets[g]/maxS*100);var share=Math.round(groupSets[g]/total*100);
    r+='<div style="margin-bottom:11px">'+
      '<div style="display:flex;justify-content:space-between;margin-bottom:4px">'+
        '<span style="font-size:13px;font-weight:600;color:var(--ink)">'+g+'</span>'+
        '<span style="font-size:12px;color:var(--ink2)" class="num">'+groupSets[g]+' sets \u00b7 '+share+'%</span>'+
      '</div>'+
      '<div style="height:8px;border-radius:4px;background:var(--hair2)">'+
        '<div style="height:8px;border-radius:4px;width:'+pct+'%;background:'+(groupColours[g]||'#C7C7CC')+'"></div>'+
      '</div></div>';
  });
  r+='</div>';
  return r;
}

function streak(){if(!db.sessions.length)return 0;var ds=[];db.sessions.forEach(function(s){if(ds.indexOf(s.date)<0)ds.push(s.date);});ds.sort().reverse();
  var st=0,cur=new Date(todayStr());for(var i=0;i<ds.length;i++){var diff=Math.round((cur-new Date(ds[i]))/86400000);if(diff<=1){st++;cur=new Date(ds[i]);}else break;}return st;}
function lineChart(pts){if(pts.length<2)return '<p class="muted tiny" style="text-align:center;padding:24px 0">Two or more sessions with this lift will draw the trend.</p>';
  var W=500,H=170,padL=8,padR=8,padT=18,padB=22,ys=pts.map(function(p){return p.v;}),minY=Math.min.apply(null,ys),maxY=Math.max.apply(null,ys),rng=maxY-minY||1;
  var X=function(i){return padL+(i/(pts.length-1))*(W-padL-padR);},Y=function(v){return padT+(1-(v-minY)/rng)*(H-padT-padB);};
  var line='',area='',dots='';pts.forEach(function(p,i){var x=X(i).toFixed(1),y=Y(p.v).toFixed(1);line+=(i?'L':'M')+x+' '+y+' ';dots+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="#FFFFFF" stroke="#565A61" stroke-width="2"/>';});
  area='M'+X(0).toFixed(1)+' '+(H-padB)+' '+line.replace('M','L')+'L'+X(pts.length-1).toFixed(1)+' '+(H-padB)+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:170px;display:block" preserveAspectRatio="none">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#565A61" stop-opacity="0.16"/><stop offset="1" stop-color="#565A61" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<path d="'+line+'" fill="none" stroke="#565A61" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+dots+
    '<text x="'+padL+'" y="12" fill="#98989D" font-size="11" font-weight="600">'+maxY+' kg</text>'+
    '<text x="'+padL+'" y="'+(H-6)+'" fill="#98989D" font-size="11" font-weight="600">'+minY+' kg</text></svg>';}

function exportData(){var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ledger-'+todayStr()+'.json';a.click();toast('Exported');}
/* import merges rather than replaces wholesale: any key the backup file doesn't know about
   (e.g. body weight, or settings added after the file was exported) keeps its current value
   instead of being silently wiped. prefs are merged key-by-key for the same reason. */
function importData(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{
  var inc=JSON.parse(rd.result);
  if(!inc||typeof inc!=='object')throw new Error('bad file');
  var merged=Object.assign({},blank,db,inc);
  merged.prefs=Object.assign({},db.prefs||{},inc.prefs||{});
  if(!Array.isArray(merged.bodyweight))merged.bodyweight=[];
  db=merged;save();render();toast('Imported');
}catch(e){toast('That file did not read');}};rd.readAsText(f);}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function escAttr(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}

buildNav();render();

/* splash: hold briefly after the bars settle, fade out, then drop it from the DOM entirely */
(function(){
  var el=document.getElementById('splash');if(!el)return;
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var holdMs=reduced?250:1450;
  setTimeout(function(){
    el.classList.add('hide');
    setTimeout(function(){el.remove();},420);
  },holdMs);
})();
</script>
